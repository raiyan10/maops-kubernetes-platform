# DAY5: every Pod in maops-platform (gateway/app/state) needs outbound
# DNS to resolve Service names (BACKEND_HOST=maops-app,
# STATE_HOST=maops-state) - this is the one egress allow that applies
# namespace-wide (podSelector: {}) rather than per-component. The peer
# is CoreDNS in kube-system, selected by the standard `k8s-app: kube-dns`
# Pod label and the namespace's own automatic, stable
# `kubernetes.io/metadata.name` label (set by the API server on every
# namespace since Kubernetes 1.22, never a hand-maintained label we
# could get out of sync) - never a Pod IP or node name.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maops-allow-dns-egress
  namespace: maops-platform
  labels:
    app.kubernetes.io/name: maops-kubernetes-platform
    app.kubernetes.io/instance: maops-kubernetes-platform-day5
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/part-of: maops-kubernetes-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
