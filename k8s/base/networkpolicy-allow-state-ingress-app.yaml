# DAY5: state accepts ingress ONLY from app - gateway has no matching
# egress allow to state (networkpolicy-allow-gateway-egress-app.yaml
# only ever targets app), so gateway -> state is denied by the
# default-deny baseline with no allow rule to override it on either
# side.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maops-allow-state-ingress-from-app
  namespace: maops-platform
  labels:
    app.kubernetes.io/name: maops-kubernetes-platform
    app.kubernetes.io/instance: maops-kubernetes-platform-day5
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/component: state
    app.kubernetes.io/part-of: maops-kubernetes-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: state
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 8080
