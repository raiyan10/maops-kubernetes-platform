apiVersion: v1
kind: ConfigMap
metadata:
  name: maops-gateway-config
  namespace: maops-platform
  labels:
    app.kubernetes.io/name: maops-kubernetes-platform
    app.kubernetes.io/instance: maops-kubernetes-platform-day3
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: maops-kubernetes-platform
    app.kubernetes.io/managed-by: kustomize
data:
  # Service discovery (unchanged since Day 2): the gateway reaches the
  # app workload only through the Kubernetes Service DNS name - never a
  # Pod IP, Pod name, or hardcoded ClusterIP.
  BACKEND_HOST: "maops-app"
  BACKEND_PORT: "8080"
  BACKEND_TIMEOUT_SECONDS: "3"
  APP_NAME: "maops-kubernetes-gateway"
  APP_ENVIRONMENT: "day3-scaling-rollouts-availability"
  APP_MESSAGE: "Hello from the MAOps Kubernetes Gateway (Day 3)"
  APP_LOG_LEVEL: "info"
