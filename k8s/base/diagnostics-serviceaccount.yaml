# DAY5: the one identity in this project that DOES receive an
# automounted API token - it exists specifically to exercise real
# `kubectl auth can-i` / live API-call authorization from inside a
# Pod (scripts/rbac_check.py), so a mounted token is required, not
# incidental. It lives in maops-day5-validation (never
# maops-platform) and is bound to a namespace-scoped Role against
# maops-platform via a cross-namespace RoleBinding subject (see
# diagnostics-role.yaml / diagnostics-rolebinding.yaml) - never a
# ClusterRole/ClusterRoleBinding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maops-diagnostics
  namespace: maops-day5-validation
  labels:
    app.kubernetes.io/name: maops-kubernetes-platform
    app.kubernetes.io/instance: maops-kubernetes-platform-day5
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/component: diagnostics
    app.kubernetes.io/part-of: maops-kubernetes-platform
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: true
