apiVersion: v1
kind: ConfigMap
metadata:
  name: maops-app-config
  namespace: maops-platform
  labels:
    app.kubernetes.io/name: maops-kubernetes-platform
    app.kubernetes.io/instance: maops-kubernetes-platform-day4
    app.kubernetes.io/version: "0.4.0"
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: maops-kubernetes-platform
    app.kubernetes.io/managed-by: kustomize
data:
  APP_NAME: "maops-kubernetes-app"
  APP_ENVIRONMENT: "day4-stateful-persistence"
  APP_MESSAGE: "Hello from the MAOps Kubernetes App (Day 4)"
  APP_LOG_LEVEL: "info"
  # DAY4: service discovery for the new state workload, same pattern as
  # gateway's BACKEND_HOST/BACKEND_PORT - the Kubernetes Service DNS
  # name, never a Pod IP/name or hardcoded ClusterIP.
  STATE_HOST: "maops-state"
  STATE_PORT: "8080"
  STATE_TIMEOUT_SECONDS: "3"
