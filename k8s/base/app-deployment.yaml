apiVersion: apps/v1
kind: Deployment
metadata:
  name: maops-app
  namespace: maops-platform
  labels:
    app.kubernetes.io/name: maops-kubernetes-platform
    app.kubernetes.io/instance: maops-kubernetes-platform-day3
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: maops-kubernetes-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 3
  # RollingUpdate tuning (DAY3): explicit rather than relying on
  # Kubernetes' own defaults - see maops-gateway's Deployment for the
  # full rationale, identical here.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: maops-kubernetes-platform
      app.kubernetes.io/instance: maops-kubernetes-platform-day3
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maops-kubernetes-platform
        app.kubernetes.io/instance: maops-kubernetes-platform-day3
        app.kubernetes.io/version: "0.3.0"
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: maops-kubernetes-platform
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Scheduling (DAY3): see maops-gateway's Deployment for the full
      # rationale - identical required node affinity (never the
      # control-plane node) and topology spread (never counting gateway
      # Pods) here.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Explicit rather than relying on the Kubernetes-version default
          # (DAY3-ARCH-L1): a future default change must never silently
          # alter which nodes/taints this constraint honors.
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: maops-kubernetes-platform
              app.kubernetes.io/instance: maops-kubernetes-platform-day3
              app.kubernetes.io/component: app
      containers:
        - name: maops-app
          image: maops-kubernetes-app:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: maops-app-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: internal-auth
              mountPath: /var/run/secrets/maops
              readOnly: true
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 15
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: internal-auth
          secret:
            secretName: maops-internal-auth
            # Decimal 288 == octal 0440 (owner/group read-only, matched
            # against fsGroup: 10001 above so UID/GID 10001:10001 can read
            # the mounted token file without a world-readable mode).
            defaultMode: 288
