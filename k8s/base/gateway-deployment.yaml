apiVersion: apps/v1
kind: Deployment
metadata:
  name: maops-gateway
  namespace: maops-platform
  labels:
    app.kubernetes.io/name: maops-kubernetes-platform
    app.kubernetes.io/instance: maops-kubernetes-platform-day2
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: maops-kubernetes-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: maops-kubernetes-platform
      app.kubernetes.io/instance: maops-kubernetes-platform-day2
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maops-kubernetes-platform
        app.kubernetes.io/instance: maops-kubernetes-platform-day2
        app.kubernetes.io/version: "0.2.0"
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: maops-kubernetes-platform
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maops-gateway
          image: maops-kubernetes-gateway:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: maops-gateway-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: internal-auth
              mountPath: /var/run/secrets/maops
              readOnly: true
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 15
            timeoutSeconds: 1
          livenessProbe:
            # Local-process liveness ONLY - must never depend on the app
            # backend (no circular readiness/liveness across the two
            # workloads).
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # Dependency-aware: gateway's own /readyz handler performs a
            # bounded HTTP check against http://maops-app:8080/readyz.
            # timeoutSeconds here is kept comfortably above
            # BACKEND_TIMEOUT_SECONDS (3s) so the probe itself never times
            # out before the app-level bounded check can complete.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: internal-auth
          secret:
            secretName: maops-internal-auth
            # Decimal 288 == octal 0440 (owner/group read-only, matched
            # against fsGroup: 10001 above so UID/GID 10001:10001 can read
            # the mounted token file without a world-readable mode).
            defaultMode: 288
