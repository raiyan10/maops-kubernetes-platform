apiVersion: apps/v1
kind: Deployment
metadata:
  name: maops-gateway
  namespace: maops-platform
  labels:
    app.kubernetes.io/name: maops-kubernetes-platform
    app.kubernetes.io/instance: maops-kubernetes-platform-day3
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: maops-kubernetes-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 3
  # RollingUpdate tuning (DAY3): explicit rather than relying on
  # Kubernetes' own defaults (which happen to match maxUnavailable=1/
  # maxSurge=1 today, but that's a default, not a contract - Day 3 pins
  # it so a future Kubernetes version changing its defaults can never
  # silently change this project's rollout behavior).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  # A Pod must stay Ready for 5s before it counts toward availability -
  # guards against a flapping/crash-looping replacement being counted
  # as "successfully rolled out" the instant its readinessProbe first
  # passes.
  minReadySeconds: 5
  # Bounds how long the rollout controller waits for progress before
  # marking the Deployment's Progressing condition False - a stuck
  # rollout (e.g. a bad image that never becomes Ready) is reported as a
  # real failure within 2 minutes rather than hanging indefinitely.
  progressDeadlineSeconds: 120
  # Keep the last 5 ReplicaSets so `kubectl rollout undo` has real
  # revision history to roll back to.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: maops-kubernetes-platform
      app.kubernetes.io/instance: maops-kubernetes-platform-day3
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maops-kubernetes-platform
        app.kubernetes.io/instance: maops-kubernetes-platform-day3
        app.kubernetes.io/version: "0.3.0"
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: maops-kubernetes-platform
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Scheduling (DAY3): workloads must never land on the
      # control-plane node. The default kind control-plane taint alone
      # is not relied on - this required node affinity is a second,
      # independent guarantee that holds even if the taint were ever
      # removed.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # Spread gateway replicas across worker nodes (never counting app
      # Pods - the labelSelector below is scoped to this workload's own
      # component only). With 3 replicas across 2 workers, maxSkew: 1
      # allows the only two distributions that are actually possible
      # (2/1 or 1/2) while still rejecting a 3/0 pile-up. Hard pod
      # anti-affinity is deliberately NOT used here - it would demand a
      # perfectly even split, which is mathematically impossible for 3
      # replicas over 2 nodes and would leave one replica permanently
      # unschedulable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Explicit rather than relying on the Kubernetes-version default
          # (DAY3-ARCH-L1): a future default change must never silently
          # alter which nodes/taints this constraint honors.
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: maops-kubernetes-platform
              app.kubernetes.io/instance: maops-kubernetes-platform-day3
              app.kubernetes.io/component: gateway
      containers:
        - name: maops-gateway
          image: maops-kubernetes-gateway:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: maops-gateway-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: internal-auth
              mountPath: /var/run/secrets/maops
              readOnly: true
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 15
            timeoutSeconds: 1
          livenessProbe:
            # Local-process liveness ONLY - must never depend on the app
            # backend (no circular readiness/liveness across the two
            # workloads).
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # Dependency-aware: gateway's own /readyz handler performs a
            # bounded HTTP check against http://maops-app:8080/readyz.
            # timeoutSeconds here is kept comfortably above
            # BACKEND_TIMEOUT_SECONDS (3s) so the probe itself never times
            # out before the app-level bounded check can complete.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: internal-auth
          secret:
            secretName: maops-internal-auth
            # Decimal 288 == octal 0440 (owner/group read-only, matched
            # against fsGroup: 10001 above so UID/GID 10001:10001 can read
            # the mounted token file without a world-readable mode).
            defaultMode: 288
