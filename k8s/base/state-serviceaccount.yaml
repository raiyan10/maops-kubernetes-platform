# DAY5: purpose-built identity for the state workload - see
# gateway-serviceaccount.yaml for the full rationale, identical here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maops-state
  namespace: maops-platform
  labels:
    app.kubernetes.io/name: maops-kubernetes-platform
    app.kubernetes.io/instance: maops-kubernetes-platform-day5
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/component: state
    app.kubernetes.io/part-of: maops-kubernetes-platform
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
