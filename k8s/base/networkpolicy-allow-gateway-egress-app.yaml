# DAY5: gateway -> app is the only egress maops-gateway Pods are
# allowed (besides DNS) - explicitly does NOT include maops-state, so
# gateway can never reach state directly. Selector is the stable
# app.kubernetes.io/component label (never a Pod IP/name).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maops-allow-gateway-egress-to-app
  namespace: maops-platform
  labels:
    app.kubernetes.io/name: maops-kubernetes-platform
    app.kubernetes.io/instance: maops-kubernetes-platform-day5
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: maops-kubernetes-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 8080
