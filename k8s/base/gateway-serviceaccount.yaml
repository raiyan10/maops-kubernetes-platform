# DAY5: purpose-built identity for the gateway workload. Explicitly
# NOT bound to any Role/RoleBinding/ClusterRole - gateway never talks
# to the Kubernetes API, so it needs no RBAC grant at all, only an
# identity distinct from the implicit `default` ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maops-gateway
  namespace: maops-platform
  labels:
    app.kubernetes.io/name: maops-kubernetes-platform
    app.kubernetes.io/instance: maops-kubernetes-platform-day5
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: maops-kubernetes-platform
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
