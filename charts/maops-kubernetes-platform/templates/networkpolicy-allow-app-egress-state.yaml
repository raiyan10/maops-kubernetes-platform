{{- if .Values.networkPolicy.enabled }}
# DAY5 (unchanged for Day 6): app -> state is the only application
# egress maops-app Pods are allowed toward the state workload. Mirrors
# networkpolicy-allow-gateway-egress-app.yaml one hop deeper in the
# chain. DAY6 caveat: meaningful for plaintext/non-ambient paths only -
# see networkpolicy-allow-gateway-egress-app.yaml's header comment and
# networkpolicy-allow-hbone.yaml for why the real ambient path is
# governed by Istio AuthorizationPolicy (maops-state-authz) instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maops-allow-app-egress-to-state
  namespace: {{ .Values.release.namespace }}
  labels:
    {{- include "maops.componentLabels" (dict "root" $ "component" "app") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: app
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: state
      ports:
        - protocol: TCP
          port: {{ .Values.state.containerPort }}
{{- end }}
