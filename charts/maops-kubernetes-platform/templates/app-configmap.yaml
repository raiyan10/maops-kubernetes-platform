apiVersion: v1
kind: ConfigMap
metadata:
  name: maops-app-config
  namespace: {{ .Values.release.namespace }}
  labels:
    {{- include "maops.componentLabels" (dict "root" $ "component" "app") | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.config.appName | quote }}
  APP_ENVIRONMENT: {{ .Values.app.config.appEnvironment | quote }}
  APP_MESSAGE: {{ .Values.app.config.appMessage | quote }}
  APP_LOG_LEVEL: {{ .Values.app.config.appLogLevel | quote }}
  # DAY4 (unchanged since): service discovery for the state workload,
  # same pattern as gateway's BACKEND_HOST/BACKEND_PORT - the
  # Kubernetes Service DNS name, never a Pod IP/name or hardcoded
  # ClusterIP.
  STATE_HOST: "maops-state"
  STATE_PORT: {{ .Values.state.containerPort | quote }}
  STATE_TIMEOUT_SECONDS: {{ .Values.app.config.stateTimeoutSeconds | quote }}
