# DAY5 (unchanged design for Day 6): purpose-built identity for the
# app workload - see gateway-serviceaccount.yaml for the full
# rationale, identical here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maops-app
  namespace: {{ .Values.release.namespace }}
  labels:
    {{- include "maops.componentLabels" (dict "root" $ "component" "app") | nindent 4 }}
automountServiceAccountToken: false
