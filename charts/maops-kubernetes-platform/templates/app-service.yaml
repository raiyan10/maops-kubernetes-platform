apiVersion: v1
kind: Service
metadata:
  name: maops-app
  namespace: {{ .Values.release.namespace }}
  labels:
    {{- include "maops.componentLabels" (dict "root" $ "component" "app") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "maops.selectorLabels" (dict "root" $ "component" "app") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.containerPort }}
      targetPort: http
      protocol: TCP
