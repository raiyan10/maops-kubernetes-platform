apiVersion: v1
kind: ConfigMap
metadata:
  name: maops-state-config
  namespace: {{ .Values.release.namespace }}
  labels:
    {{- include "maops.componentLabels" (dict "root" $ "component" "state") | nindent 4 }}
data:
  APP_NAME: {{ .Values.state.config.appName | quote }}
  APP_ENVIRONMENT: {{ .Values.state.config.appEnvironment | quote }}
  APP_MESSAGE: {{ .Values.state.config.appMessage | quote }}
  APP_LOG_LEVEL: {{ .Values.state.config.appLogLevel | quote }}
  # Persisted record path - always on the PVC-backed volume mounted at
  # /data (see the StatefulSet's volumeClaimTemplates), never the
  # read-only root filesystem.
  STATE_FILE_PATH: {{ .Values.state.config.stateFilePath | quote }}
  # Bounded UTF-8 request body size for PUT /state - rejects an
  # oversized payload before it is ever fully read into memory.
  STATE_MAX_BODY_BYTES: {{ .Values.state.config.stateMaxBodyBytes | quote }}
