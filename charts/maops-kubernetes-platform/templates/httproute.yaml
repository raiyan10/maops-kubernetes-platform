# DAY6: the application chart owns this HTTPRoute (it is
# application-routing configuration, not cluster/platform
# infrastructure) - it attaches to the `{{ .Values.routing.gateway.name }}`
# Gateway object, which lives in `{{ .Values.routing.gateway.namespace }}`
# and is a cluster/platform support object applied via k8s/day6/
# (never created by this chart). Gateway API `parentRefs` is exactly
# how a cross-namespace HTTPRoute -> Gateway attachment is expressed -
# the Gateway's own `allowedRoutes.namespaces.selector` (see
# k8s/day6/gateway.yaml) is what makes this namespace's HTTPRoutes
# eligible to attach at all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maops-gateway-route
  namespace: {{ .Values.release.namespace }}
  labels:
    {{- include "maops.componentLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.routing.gateway.name }}
      namespace: {{ .Values.routing.gateway.namespace }}
  hostnames:
    - {{ .Values.routing.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: maops-gateway
          port: {{ .Values.gateway.containerPort }}
