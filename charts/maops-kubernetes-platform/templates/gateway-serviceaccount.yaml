# DAY5 (unchanged design for Day 6): purpose-built identity for the
# gateway workload. Explicitly NOT bound to any Role/RoleBinding/
# ClusterRole - gateway never talks to the Kubernetes API, so it needs
# no RBAC grant at all, only an identity distinct from the implicit
# `default` ServiceAccount. This is also the identity the gateway's
# AuthorizationPolicy source-principal checks (app -> gateway ingress
# is NOT expected here - gateway receives ingress from the Istio
# Gateway, never from app/state) never need to reference as a target.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maops-gateway
  namespace: {{ .Values.release.namespace }}
  labels:
    {{- include "maops.componentLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
automountServiceAccountToken: false
