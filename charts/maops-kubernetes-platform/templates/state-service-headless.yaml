apiVersion: v1
kind: Service
metadata:
  name: maops-state-headless
  namespace: {{ .Values.release.namespace }}
  labels:
    {{- include "maops.componentLabels" (dict "root" $ "component" "state") | nindent 4 }}
spec:
  # Governing Service required by StatefulSet.spec.serviceName - gives
  # maops-state-0 a stable per-Pod DNS identity. Not used for normal
  # client traffic (that goes through the maops-state ClusterIP Service
  # instead); this exists purely to satisfy the StatefulSet contract.
  clusterIP: None
  selector:
    {{- include "maops.selectorLabels" (dict "root" $ "component" "state") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.state.containerPort }}
      targetPort: http
      protocol: TCP
