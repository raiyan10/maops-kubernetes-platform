# Default values for the maops-kubernetes-platform application chart
# (introduced Day 6, extended Day 7 with an OPTIONAL gateway candidate
# and explicit HTTPRoute traffic modes - both off/stable by default, so
# the default render keeps Day 6's stable-only object inventory).
# Installed as:
#   helm upgrade --install maops-kubernetes-platform-day6 \
#     charts/maops-kubernetes-platform --namespace maops-platform
# (Day 6 cluster), or, for the isolated Day 7 cluster, always with an
# explicit stage file and --reset-values:
#   helm upgrade --install maops-kubernetes-platform-day7 \
#     charts/maops-kubernetes-platform --namespace maops-platform \
#     --reset-values -f helm-values/day7/stable.yaml
#
# Resource NAMES are deliberately kept stable across days (maops-gateway,
# maops-app, maops-state, maops-diagnostics) and are NOT templated from
# the release name - only the standard
# app.kubernetes.io/instance=<release name> LABEL varies by release, the
# same convention Days 1-5's Kustomize base already used (instance
# label = maops-kubernetes-platform-day<N>, object names unchanged).
#
# k8s/base (the frozen Day 5 Kustomize source) is never a dependency of
# this chart and this chart never reads it - the two sources are wired
# to completely independent Makefile targets (`deploy` here uses
# `helm upgrade --install` only, never `kubectl apply -k k8s/base`).

nameOverride: ""
fullnameOverride: ""

# The Namespace this release's application objects live in. The
# Namespace object ITSELF is a cluster/platform support object, not an
# application workload - it is applied separately via
# k8s/day6/platform-namespace.yaml (`make namespace-apply`), never
# created by this chart. This value must match that Namespace's name;
# it is used for cross-namespace references (RoleBinding subject
# namespace, NetworkPolicy namespaceSelector) that must stay in sync
# with wherever this release is actually installed.
release:
  namespace: maops-platform

# The validation/diagnostics namespace and identity - also a
# cluster/platform support object applied via k8s/day6/, never created
# by this chart. Referenced here only so the chart's own
# Role/RoleBinding (which grant access INTO release.namespace FOR this
# identity) can name it correctly.
validation:
  namespace: maops-day6-validation
  diagnostics:
    serviceAccountName: maops-diagnostics

# Gateway API / Istio ingress Gateway routing. The Gateway object
# itself (`maops-edge`) lives in k8s/day6/ (a platform/cluster support
# object, not an application workload) - this chart owns only the
# HTTPRoute that attaches to it.
routing:
  hostname: maops.local
  gateway:
    name: maops-edge
    namespace: maops-ingress
    # Istio's Gateway API deployment controller deterministically names
    # the ServiceAccount it generates for a Gateway "<gateway-name>-istio" -
    # used to build the AuthorizationPolicy source principal for the
    # ingress-Gateway -> maops-gateway identity path
    # (cluster.local/ns/<gateway.namespace>/sa/<gateway.serviceAccountName>).
    serviceAccountName: maops-edge-istio
  # DAY7: explicit traffic mode for the ONE Helm-owned HTTPRoute
  # (maops-gateway-route). Exactly one of:
  #   stable    - one backendRef, service/maops-gateway (default; renders
  #               the same single backendRef Day 6 rendered, no weight)
  #   candidate - one backendRef, service/maops-gateway-candidate
  #               (Blue/Green cutover; requires candidate.enabled=true)
  #   weighted  - two backendRefs, stable + candidate, with explicit
  #               integer weights (Canary; requires candidate.enabled=true)
  # `stableWeight`/`candidateWeight` are deliberately NOT defaulted here:
  # they are required when mode=weighted (each 1-99, summing to exactly
  # 100 - enforced by values.schema.json and again by the template) and
  # rejected in every other mode, so a stale weight can never silently
  # ride along into a stable or candidate render.
  mode: stable

# DAY7: when true (set by every helm-values/day7 stage file), the chart
# refuses to render unless images.{gateway,app,state}.tag are pinned
# build tags <appVersion>-cfg-<config digest> (see
# "maops.validatePinnedBuild" in _helpers.tpl). false keeps the Day 6
# default render byte-for-byte unchanged.
build:
  requirePinnedTags: false

images:
  gateway:
    repository: maops-kubernetes-gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  app:
    repository: maops-kubernetes-app
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  state:
    repository: maops-kubernetes-state
    tag: "1.0.0"
    pullPolicy: IfNotPresent

# Unchanged since Day 1/2: applied identically to every workload
# container. Kept as one shared block (rather than duplicated per
# workload) since Days 1-5 never varied it - each workload template
# still renders its own explicit securityContext, this is only a
# values-level convenience for a single place to tune it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

gateway:
  replicas: 3
  containerPort: 8080
  resources: {}
  config:
    backendTimeoutSeconds: 5
    appName: maops-kubernetes-gateway
    appEnvironment: day7-deployment-strategies
    appMessage: "Hello from the MAOps Kubernetes Gateway (Day 7 stable)"
    appLogLevel: info
  pdb:
    enabled: true
    minAvailable: 2

# DAY7: OPTIONAL gateway candidate - a second, independently-selected
# gateway Deployment (maops-gateway-candidate) used ONLY to demonstrate
# Blue/Green, Canary and (candidate-scoped) Recreate. Disabled by
# default: the default render contains no candidate object at all.
#
# What the candidate is, honestly: the SAME gateway image, the SAME
# ServiceAccount (maops-gateway - so stable and candidate share ONE
# Istio workload principal, cluster.local/ns/maops-platform/sa/maops-gateway;
# the mesh cannot tell them apart), the SAME internal-auth Secret mount
# and the SAME security context as the stable gateway. It differs only
# in its own ConfigMap's non-secret APP_MESSAGE - a CONFIGURATION
# variant, not a different application binary.
#
# Isolation is by label, never by name: candidate objects carry
# app.kubernetes.io/component=gateway-candidate, which none of the
# stable gateway's Deployment/Service/PDB/NetworkPolicy/
# AuthorizationPolicy selectors (all component=gateway) can match, and
# vice versa. Candidate-only NetworkPolicies/AuthorizationPolicy render
# only when enabled=true.
candidate:
  enabled: false
  # 2 replicas - one per worker under the candidate's own
  # topologySpreadConstraints; enough to show Recreate terminating ALL
  # old Pods before any replacement exists.
  replicas: 2
  # RollingUpdate (stable-gateway-equivalent maxUnavailable/maxSurge) or
  # Recreate. Recreate renders NO rollingUpdate block. Only this
  # candidate Deployment may ever use Recreate - the stable gateway and
  # the state StatefulSet are never switched to it.
  strategy: RollingUpdate
  config:
    # Must differ from gateway.config.appMessage (the template fails
    # otherwise): this message is how an external request is
    # identified as served by the candidate.
    appMessage: "Hello from the MAOps Kubernetes Gateway (Day 7 candidate)"
  # Controlled negative-test knob ONLY (Canary's candidate-unready
  # scenario): points the candidate's readinessProbe at a path the
  # gateway answers with 404, so candidate Pods start and stay live but
  # never become Ready. The schema only allows it with
  # candidate.enabled=true AND routing.mode=stable - an intentionally
  # unready candidate can never be rendered as a route backend.
  faultInjection:
    failReadiness: false

app:
  replicas: 3
  containerPort: 8080
  resources: {}
  config:
    stateTimeoutSeconds: 3
    appName: maops-kubernetes-app
    appEnvironment: day7-deployment-strategies
    appMessage: "Hello from the MAOps Kubernetes App (Day 7)"
    appLogLevel: info
  pdb:
    enabled: true
    minAvailable: 2

state:
  replicas: 1
  containerPort: 8080
  resources: {}
  config:
    stateFilePath: /data/state.json
    stateMaxBodyBytes: 4096
    appName: maops-kubernetes-state
    appEnvironment: day7-deployment-strategies
    appMessage: "Hello from the MAOps Kubernetes State service (Day 7)"
    appLogLevel: info
  storage:
    requests: 256Mi
    # Empty string == use the cluster's verified default StorageClass
    # (rancher.io/local-path), unchanged since Day 4 - never hardcoded
    # to a class name that may not exist on every cluster this chart
    # could be installed against.
    storageClassName: ""

# Both runtime Secrets (maops-internal-auth, maops-state-auth) are
# deliberately NEVER represented here - no key, no default, no
# generator. They remain externally bootstrapped by
# scripts/secret_bootstrap.py (`make secret-bootstrap`), exactly as in
# Days 2/4/5, and are referenced by NAME only in the Deployment/
# StatefulSet volume templates.
secrets:
  internalAuthName: maops-internal-auth
  stateAuthName: maops-state-auth

networkPolicy:
  enabled: true

meshPolicy:
  enabled: true
