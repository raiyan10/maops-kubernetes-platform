# DAY8: KEDA v2.21.0 (chart keda 2.21.0, from https://kedacore.github.io/charts)
# on maops-k8s-day7 (Kubernetes v1.36.1; upstream tested window for
# KEDA v2.21: Kubernetes 1.34-1.36). Installed by `make day8-addons-install`
# with --reset-values -f <this file>; validated statically by
# `make day8-static-check`.
#
# watchNamespace = the scaling namespace: KEDA's broad `keda-operator`
# ClusterRole (Secrets list/watch, */scale patch, get on everything) is then
# bound ONLY by RoleBindings in `keda` and `maops-day8-scaling` - never by a
# ClusterRoleBinding - so KEDA cannot read Secrets or scale workloads in
# maops-platform (proven live with SubjectAccessReviews by
# `make day8-addons-check`). Lifecycle consequence: that RoleBinding lives in
# the TEMPORARY namespace, so `day8-guards` must create the namespace BEFORE
# `day8-addons-install` (an earlier cluster-wide workaround, run 1c59a36c...,
# was reverted), cleanup deletes the binding with the namespace (KEDA is then
# dormant - `make day8-addons-final-check`), and the next run's install
# re-creates it. The chart's secure-by-default security contexts are kept;
# only replica counts and resource sizing are reduced.
watchNamespace: "maops-day8-scaling"
operator:
  replicaCount: 1
metricsServer:
  replicaCount: 1
webhooks:
  replicaCount: 1
  # Pinned after assessment (not the chart default): the six KEDA admission
  # webhooks intercept ONLY KEDA's own kinds (keda.sh / eventing.keda.sh,
  # CREATE/UPDATE) - never a core or application resource - so Fail cannot
  # block anything outside KEDA. With Ignore, an unavailable webhook would
  # admit an unvalidated ScaledObject (e.g. one conflicting with an existing
  # HPA on the same target, breaking one-scaler-per-target). With Fail, KEDA
  # object writes - including the operator's finalizer-removal UPDATE -
  # fail while the webhook is down, so Day 8 cleanup stops at its object-
  # release step and keeps the namespace: fail-closed and recoverable.
  # Day 8 creates KEDA objects only after day8-addons-check has seen the
  # webhook Ready, and releases them before uninstalling KEDA.
  failurePolicy: "Fail"
resources:
  operator:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "500m"
      memory: "384Mi"
  metricServer:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  webhooks:
    requests:
      cpu: "25m"
      memory: "48Mi"
    limits:
      cpu: "250m"
      memory: "192Mi"
