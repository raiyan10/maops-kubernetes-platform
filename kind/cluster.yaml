# MAOps Kubernetes Platform - Day 3 kind cluster.
#
# 1 control-plane + 2 worker nodes - the first multi-node topology in
# this project. Day 3 needs real worker nodes to prove topology-aware
# scheduling (topologySpreadConstraints across kubernetes.io/hostname)
# and control-plane exclusion (required node affinity), neither of
# which is meaningfully provable on a single-node cluster. This is a
# separate, independently-created cluster from Day 1's maops-k8s-day1
# and Day 2's maops-k8s-day2 - Day 3 tooling never touches either.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: maops-k8s-day3
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
